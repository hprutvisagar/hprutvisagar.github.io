<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <style>
    body {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 1rem;
    }
    nav {
      background: #f8f8f8;
      padding: 1rem;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
    }
    nav summary {
      cursor: pointer;
      font-weight: bold;
      margin: 0.5rem 0;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding-left: 1rem;
    }
    nav li {
      margin: 0.25rem 0;
    }
    main {
      padding: 2rem;
      max-width: 900px;
    }
    nav a {
      text-decoration: none;
      color: #333;
    }
    nav a:hover {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <nav>
    <h3>AI/ML Notes</h3>
    {% assign grouped = site.notes | group_by: "chapter" %}
    {% for chapter in grouped %}
      <details>
        <summary>{{ chapter.name }}</summary>
        {% assign notes_sorted = chapter.items | sort: "weight" %}
        <ul>
          {% for note in notes_sorted %}
            <li><a href="{{ note.url }}">{{ note.title }}</a></li>
          {% endfor %}
        </ul>
      </details>
    {% endfor %}
  </nav>
  <main>
    {{ content }}
  </main>
</body>
</html>

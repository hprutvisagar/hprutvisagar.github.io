<div class="col-md-6 col-lg-4" data-reveal>
  <div class="card h-100">
    <div class="card-body d-flex flex-column">
      <span class="date">{{ include.page.date | date_to_string }}</span>
      <h3 class="card-title h5 mt-2">{{ include.page.title }}</h3>
      <p class="card-text">{{ include.page.content | markdownify | strip_html | truncatewords: 40 }}</p>
      <div class="tag-row">
        {% for label in include.page.labels %}
        <span class="badge">{{ label }}</span>
        {% endfor %}
      </div>
      <a href="{% if page.essayurl %}{{ page.essayurl }}{% else %}{{ site.baseurl}}{{ include.page.url }}{% endif %}" class="read-more mt-auto">Read more <span class="arrow">&rarr;</span></a>
    </div>
  </div>
</div>

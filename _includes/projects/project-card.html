<article class="card project-card" data-reveal>
  <div class="row g-0">
    <div class="col-md-4 project-card-media">
      <a href="{{ site.baseurl}}{{ include.page.url }}" tabindex="-1" aria-hidden="true">
        <img src="{{ site.baseurl }}/{{ include.page.image }}" alt="{{ include.page.title }}">
      </a>
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <p class="project-card-date">{{ include.page.date }}</p>
        <h3 class="card-title h5 mt-1">
          <a href="{{ site.baseurl}}{{ include.page.url }}">{{ include.page.title }}</a>
        </h3>
        <p class="card-text">{{ include.page.summary }}</p>
        <div class="tag-row">
          {% for label in include.page.labels %}
          <span class="badge">{{ label }}</span>
          {% endfor %}
        </div>
        {% if page.projecturl %}
        <a href="{{ page.projecturl }}" class="btn btn-outline-dark">Project site <span class="arrow">&rarr;</span></a>
        {% else %}
        <a href="{{ site.baseurl}}{{ include.page.url }}" class="btn btn-outline-dark">Read more <span class="arrow">&rarr;</span></a>
        {% endif %}
      </div>
    </div>
  </div>
</article>

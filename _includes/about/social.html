<a class="social-link" href="{{ include.url }}" target="_blank" rel="noopener"{% if include.label %} aria-label="{{ include.label | escape }}"{% endif %}>
  <svg class="tf-social" aria-hidden="true">
    <use xlink:href="{{ '/img/bootstrap-icons.svg' | prepend: site.baseurl }}#{{- include.name -}}"/>
  </svg>
  {% if include.label %}<span>{{ include.label }}</span>{% endif %}
</a>
